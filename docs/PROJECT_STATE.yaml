project:
  name: "Quantum Computing in Financial Services"
  type: "MSc Thesis"
  institution: "Copenhagen Business School (CBS)"
  programme: "MSc"
  researchers:
    - name: "Aleix Telesforo"
      github: "TelesforoAleix"
      role: "Lead researcher"
    - name: "Vallahrich"
      github: "vallahrich"
      role: "Co-researcher"
  repository: "https://github.com/TelesforoAleix/quantum-finance"
  methodology: "Three-phase SLR with abductive reasoning (inductive → deductive → inductive) plus experimental validation (Phase 4)"
  philosophy: "Pragmatism"
  approach: "Abductive (inductive → deductive → inductive)"
  strategy: "Systematic Literature Review (Kitchenham & Charters, 2007) + Thematic Synthesis (Thomas & Harden, 2008)"

# ===========================================================================
# PHASES
# ===========================================================================

phases:
  phase_1:
    name: "Framework Synthesis"
    folder: "p1_framework_synthesis/"
    status: "complete"
    completion_pct: 100
    completed_date: "2026-04-11"
    analytical_movement: "Inductive"
    method: "Scoping/framework synthesis with LLM-assisted extraction; not a completed strict Elo & Kyngas inductive content-analysis protocol"
    description: >
      Build conceptual framework (problem × solution taxonomy) from exploratory
      reading of academic papers and industry reports. LLM acts as analytical
      assistant; all final categorisation decisions made by researcher.
    corpus_size: 20  # ≈20 effective independent surveys (29 raw – 1 quarantined – 7 EXCLUSIONS – 1 Herman duplicate); see p1_framework_synthesis/FREEZE.md
    key_outputs:
      - path: "p1_framework_synthesis/s4_outputs/conceptual-framework.md"
        description: "Conceptual framework: 10 PD codes × 11 SA codes with mapping matrix"
      - path: "p1_framework_synthesis/s4_outputs/codebook.md"
        description: "Classification codebook operationalising the taxonomy for Phase 2"
      - path: "p1_framework_synthesis/audit-trail.md"
        description: "LLM proposal vs researcher decision log (4 entries)"
      - path: "p1_framework_synthesis/s1_extractions/"
        description: "29 structured extraction JSONs (≈20 effective after 1 quarantined + 7 EXCLUSIONS + 1 Herman duplicate)"
      - path: "p1_framework_synthesis/s2_coding/"
        description: "Review workbook and manual annotations"
    delivers_to:
      - consumer: "phase_2"
        artifact: "Taxonomy codes (PD-01..10, SA-01..11) + codebook"
        contract: "Phase 2 uses these codes as the deductive classification scheme"
      - consumer: "phase_3"
        artifact: "Problem-space categories as silo boundaries"
        contract: "Phase 3 uses PD codes to define silo folder structure"
      - consumer: "manuscript"
        artifact: "Framework narrative for Chapter 2 (Background)"
        contract: "Chapter 2 presents the framework narratively"
    pending_researcher_review:
      # All Phase 1 boundary decisions are CLOSED in p1_framework_synthesis/FREEZE.md (D-1..D-6).
      # PD-10 retracted into PD-03 (D-2); PD-08 excluded from active scope (D-3); 7 EXCLUSIONS verified.
      # SA-07 and SA-10 retained as-is in unified_taxonomy.json v2.0.
      []

  phase_2:
    name: "Systematic Identification & Classification"
    folder: "p2_systematic_review/"
    status: "complete"
    completion_pct: 100
    completed_date: "2026-04-14"
    analytical_movement: "Deductive"
    method: "SLR protocol (Kitchenham & Charters, 2007) + 6-step LLM extraction"
    description: >
      Systematically search, screen, and classify the full corpus against
      the Phase 1 framework. Six-step LLM-assisted extraction pipeline
      using gpt-5-mini on Azure.
    key_metrics:
      total_papers_processed: 777
      active_downstream_subset: 755  # 777 – 22 retro-excluded as off-scope; see p2_systematic_review/output/audit/excluded_post_classification.csv
      retro_excluded_off_scope: 22
      extraction_model: "gpt-5-mini"
      extraction_steps: 6
    key_outputs:
      - path: "p2_systematic_review/output/processed/*.md"
        description: "Structured markdown per paper with frontmatter tags"
      - path: "p2_systematic_review/s1_slr/04_figures/fig1_prisma_flow.pdf"
        description: "PRISMA flow diagram"
      - path: "p2_systematic_review/processing_log.json"
        description: "Processing log for all extraction steps"
      - path: "p2_systematic_review/s2_classification/"
        description: "Extraction prompts, scripts, and output"
    delivers_to:
      - consumer: "phase_3"
        artifact: "Classified corpus with topic_tags and methodology_tags"
        contract: "Phase 3 reads processed/*.md for within-silo thematic synthesis"
      - consumer: "phase_4"
        artifact: "Paper metadata and has_quantitative_results flag"
        contract: "Phase 4 uses paper_id bridge and classification for experiment selection"
      - consumer: "manuscript"
        artifact: "SLR results for Chapter 5"
        contract: "Chapter 5 reports classification statistics and PRISMA flow"
    residual_tasks:
      - "Triage 13 papers with relevance_phase3: not-yet-assessed"
      - "Decide fate of empty classification/paper_type frontmatter fields"

  phase_3:
    name: "Thematic Synthesis"
    folder: "p3_thematic_synthesis/"
    status: "in_progress"
    completion_pct: 55
    analytical_movement: "Inductive"
    method: "Thematic synthesis (Thomas & Harden, 2008; Cruzes & Dybå, 2011) with LLM-assisted coding and 5-layer safeguard architecture"
    description: >
      Within-silo inductive thematic synthesis, quantitative benchmark extraction,
      and quantum advantage assessment. Fresh coding prevents silo labels from
      anchoring analysis. LLM performs mechanical coding; researcher retains
      interpretive authority via tiered review.
    note: "Restructured 2026-04-19. Pilot complete 2026-04-22 (11 iterations). Production config: A1=gpt-5.4-mini+v2, A2/L3=gpt-5.1 hybrid initially; L3 full-coverage rerun on gpt-5.4-mini @ prompt v3 aggregated 2026-04-22T18:58Z. R1 stratified review (153/1,291 = 11.85%) executed 2026-04-23 → 2026-04-25 across 3 working windows per day (+02:00). B1/B2/c2 themes generated 2026-04-26T09:00–11:30Z. 661 papers (3 excluded: corrupted extraction). ~2,631 API calls. s6 finance-framing sub-pipeline added 2026-04-26 afternoon (629/657 papers, 8/8 silos)."
    active_silos:
      count: 8
      list:
        - { code: "PD-01", folder: "portfolio_optimization" }
        - { code: "PD-02", folder: "derivative_pricing" }
        - { code: "PD-03", folder: "risk_management", note: "absorbs PD-10" }
        - { code: "PD-04", folder: "quantum_ml_finance", note: "absorbs forecasting_prediction" }
        - { code: "PD-05", folder: "fraud_detection" }
        - { code: "PD-06", folder: "trading_execution" }
        - { code: "PD-07", folder: "credit_lending" }
        - { code: "PD-09", folder: "simulation_monte_carlo" }
      excluded:
        - { code: "PD-08", reason: "QKD-dominated, out of gate-based scope" }
        - { code: "PD-10", reason: "8 papers, merged into PD-03" }
    sub_components:
      within_silo_coding:
        status: "complete_as_scoped"
        description: "LLM-assisted open coding (A1) → memo compression (A2) → researcher review (R1) → descriptive themes (B1) → analytical themes (B2) → researcher chapter (R2)"
        process_steps:
          - "3.1: Silo scoping + bibliometric landscape"
          - "3.2: Paper & experiment inclusion (researcher discretion)"
          - "3.2b: Text-readiness gate (automated quality filter)"
          - "3.5: Per-paper thematic analysis (A1/A2 → L3 → R1; A3 prompt deferred)"
          - "3.6: Per-silo thematic synthesis (B1→B2→R2)"
          - "3.7: Cross-silo synthesis + P4 rationale (C1→C2→C3)"
        safeguard_layers:
          - "L0: Prompt engineering (prevention)"
          - "L1: Quote verification (catches fabrication)"
          - "L2: Closed-world claim tracing (catches evidence drift)"
          - "L3: Adversarial error-finding (catches misinterpretation)"
          - "L4: Stratified human audit (catches everything else)"
      quantitative_pipeline:
        status: "frozen_active_baseline"
        description: "Benchmark extraction pipeline for reported experimental results"
        papers_extracted: 501
        experiments_extracted: 1046
        design_doc: "p3_thematic_synthesis/docs/QUANTITATIVE_PIPELINE_DESIGN.md"
      quantum_advantage_assessment:
        status: "frozen"
        frozen_date: "2026-05-02 active filtered baseline"
        description: "4-core layer + 1-veto triangulation of quantum advantage claims"
        frozen_note: "Use filtered active-silo outputs for active claims; raw 1046-row outputs are retained for provenance/sensitivity."
        consensus_distribution:
          majority_fails: 425
          low_coverage_fails: 285
          unanimous_fails: 153
          split: 139
          insufficient_data: 95
          majority_viable: 87
          low_coverage_viable: 1
        key_outputs:
          - "p3_thematic_synthesis/s3_quantum_advantage/combined/output/triangulation_matrix.json"
          - "p3_thematic_synthesis/s3_quantum_advantage/combined/output/consensus_summary.json"
          - "p3_thematic_synthesis/s3_quantum_advantage/combined/output/disagreement_cases.json"
          - "p3_thematic_synthesis/s3_quantum_advantage/derived_fields/enriched/derived_fields.json"
      finance_framing:
        status: "complete"
        completed_date: "2026-04-26"
        description: >
          Per-silo finance framing pipeline (s6_silo_framing) that extracts
          financial-problem framing from the full PDF corpus to seed the
          finance-framing sub-section of each silo chapter. Sibling extraction
          to Phase 2 (reads the same raw PDF text), not downstream of the
          thematic synthesis. Two stages: F1 per-paper extraction
          (gpt-5.4-mini, temperature 0.1) with verbatim-quote substring
          verification; F2 per-silo aggregation (gpt-5.1) with paper-id
          verification against the silo's F1-accepted set. Outputs feed
          Section (0) of each silo chapter after researcher adaptation.
        coverage:
          targets: 657
          f1_accepted: 629   # 95.7%
          f1_failed: 28      # 4 API errors + 24 parse failures (accepted as residual)
          f2_silos_completed: 8
        key_outputs:
          - "p3_thematic_synthesis/s6_silo_framing/extractions/papers/{paper_id}.json"
          - "p3_thematic_synthesis/s6_silo_framing/briefs/{silo}/f2_silo_brief.json"
          - "p3_thematic_synthesis/s6_silo_framing/logs/f1_calls.jsonl"
          - "p3_thematic_synthesis/s6_silo_framing/logs/f2_calls.jsonl"
        feeds:
          - "manuscript/03_Chapters/06_silos/{silo}.tex Section (0) — Finance framing"
          - "manuscript/03_Chapters/04_Methodology.tex §4.5 sub-section"
      manuscript_chapter_6:
        status: "ship_ready"
        completed_date: "2026-05-04"
        description: >
          Chapter 6 (Thematic Synthesis Across Eight Problem Silos) drafted,
          polished, and conformance-checked. All 8 active silos + chapter
          intro + cross-silo meta-argument + 5 propositions per silo carrying
          forward to Phase 4. 25 cross-silo A2 anchors preserved at full
          disposition; zero demotions; D-8 cascade enforced.
        ship_threshold:
          latex_clean: true             # 0 ref/citation/label warnings
          professor_review_pass: true   # 8/8 silos, no high-severity findings open
          anchor_diff_empty: true       # A2 vs C1 reconciled
          numeric_checklist_verified: true  # 11/11 chapter-level values match pipeline
          ai_use_declaration_complete: true # s6 framing + C1 + silo drafting all declared
          consistency_methodology_clean: true # Phase D sweep, all HIGH findings resolved
        commits:
          phase_b_silo_polish: "e3f56f40"
          phase_c_chapter_conformance: "c274c7e5"
          phase_d_governance_sweep: "0d9d15dc"
        deferred_polish:
          - "Length budget (D-1): full-tier silos run ~2-3x style-guide bands; trim deferred"
          - "AT codes in Move headings (D-3): chapter-wide stylistic policy deferred"
          - "Status: examined. tags on §(v) propositions for silos whose P4 experiments have not yet run: chapter-wide forward-looking convention, deferred to Phase 4 chapter integration"
        key_outputs:
          - "manuscript/03_Chapters/06_Phase3_Synthesis.tex"
          - "manuscript/03_Chapters/06_silos/{8 silos}.tex"
          - "manuscript/03_Chapters/06_silos/_chapter_intro.tex"
          - "manuscript/03_Chapters/06_silos/_cross_silo.tex"
          - "manuscript/04_Appendix/H_AI_Use_Declaration.tex (s6 subsection)"
      cross_cutting:
        status: "not_started"
        description: "Citation graph, contradiction detection, thematic indices"
        scripts_ready: true
        scripts:
          - "p3_thematic_synthesis/shared/scripts/build_citation_graph.py"
          - "p3_thematic_synthesis/shared/scripts/detect_contradictions.py"
          - "p3_thematic_synthesis/shared/scripts/build_indices.py"
          - "p3_thematic_synthesis/shared/scripts/report_missing_papers.py"
    delivers_to:
      - consumer: "phase_4"
        artifact: "Frozen triangulation matrix + extraction JSONs"
        contract: "P4 consumes frozen P3 outputs; any P3 change requires P4 shortlist regeneration"
      - consumer: "manuscript"
        artifact: "Per-silo thematic findings for Chapter 6 + silo chapters"
        contract: "Chapter 6 and 06_silos/ present within-silo and cross-silo synthesis"

  phase_4:
    name: "Experiment Replication & Validation"
    folder: "p4_experiments/"
    status: "canonical_audit_clean"
    completion_pct: 100
    description: >
      S2-backed empirical validation of quantum-finance advantage claims via
      Qiskit circuit reconstruction/proxy declaration and QDK/Azure Quantum
      Resource Estimator accounting. Measures the 'oracle tax' — the gap
      between bare/published-style and oracle-inclusive resource estimates —
      while separating family/template evidence, proxy-declared evidence, and the empty strict estimator tier.
    research_question: >
      Under standardised, oracle-inclusive resource accounting, by what factor do
      published quantum-finance experiments under-report the logical resources
      required to execute their claimed quantum-advantage workload?
    thesis_statement: >
      Published quantum-finance claims systematically under-report end-to-end
      logical resources because state-preparation cost, oracle compilation cost,
      and magic-state distillation overhead are routinely excluded.
    toolchain:
      - "Qiskit 2.3.0"
      - "QDK/qsharp 1.27.0"
      - "Azure Quantum Resource Estimator"
      - "Python 3.13.13 local venv; Dockerfile pins Python 3.11 for portable replication"
    key_metrics:
      canonical_labels: 71
      paper_faithful_strict_labels: 0
      paper_family_template_labels: 13
      proxy_declared_labels: 58
      strict_code_specimens_outside_estimator_grid: 4
      active_silos: 8
      phase8_expected_cells: 2556
      phase8_ok_records: 2519
      phase8_engine_failures: 37
      phase8_missing_records: 0
      phase8_strict_estimator_records: 0
      h4_canonical_winners: 0
      phase8d_appendix_records: 108
      phase11_latest_tarball_sha256: "2351b7b85dcf8600431c2074e842f06a0df7f298f0433f673c55e2b2da3ba1a4"
    key_outputs:
      - path: "p4_experiments/canonical/cohort.json"
        description: "Checked 71-label S2-backed cohort and phase status"
      - path: "p4_experiments/canonical/reports/"
        description: "Generated Phase 3/8/9 reports, evidence report, sensitivity grid, and audit JSON outputs"
      - path: "p4_experiments/canonical/outputs/manuscript_artifacts/"
        description: "Phase 10 manuscript tables, figure CSVs, key numbers, briefs, and captions"
      - path: "p4_experiments/canonical/release/"
        description: "Hash-stamped Phase 11 Zenodo bundle, tarball, and checksum sidecar"
      - path: "p4_experiments/core/"
        description: "Authoritative shared implementation code, templates, schemas, resource profiles, and shortlist inputs"
      - path: "p4_experiments/experiments/silos/"
        description: "Authoritative per-paper circuit/instance/proxy evidence"
      - path: "p4_experiments/infra/azure/"
        description: "Azure VM setup, sync, monitor, helper, and historical bootstrap tooling"
      - path: "p4_experiments/docs/ARCHITECTURE.md"
        description: "Professional P4 architecture and compatibility boundaries"
      - path: "p4_experiments/canonical/PRE_REGISTRATION.md"
        description: "Active canonical empirical contract and reporting rules"
    delivers_to:
      - consumer: "manuscript"
        artifact: "Audit-clean resource-estimation tables, figures, key numbers, and claim-evidence reports"
        contract: "Results/discussion must use canonical reports and outputs, preserving headline vs appendix regime boundaries"
    depends_on_frozen:
      source: "phase_3"
      frozen_date: "2026-05-02 active baseline"
      artifacts:
        - "p3_thematic_synthesis/s2_quantitative/output/extractions/*.json"
        - "p3_thematic_synthesis/s3_quantum_advantage/combined/output/triangulation_matrix.filtered.json"

# ===========================================================================
# DESIGN DECISIONS LOG
# ===========================================================================

decisions:
  - date: "2026-04-11"
    domain: "Phase 1 — Taxonomy structure"
    decision: "10 problem-space codes (PD-01..PD-10), 11 solution-space codes (SA-01..SA-11)"
    rationale: "Inductive content analysis of 29 exploratory extractions (≈20 effective independent surveys post-cleanup, per p1_framework_synthesis/FREEZE.md); categories emerged from open coding."
    impact: "Defines classification scheme for all downstream phases. PD-10 later retracted into PD-03 (D-2); PD-08 excluded from active scope (D-3)."
    source: "p1_framework_synthesis/audit-trail.md (Entry 2-3)"

  - date: "2026-04-11"
    domain: "Phase 1 — Problem boundaries"
    decision: "PD-01 (Portfolio) separated from PD-06 (Trading); PD-02 (Pricing) separated from PD-09 (Simulation)"
    rationale: "Aligned with financial domain boundaries rather than algorithmic similarity"
    impact: "Separate silos in Phase 3; distinct research questions per silo"
    source: "p1_framework_synthesis/audit-trail.md (Entry 2)"

  - date: "2026-04-11"
    domain: "Phase 1 — Low-evidence categories"
    decision: "PD-10 (Insurance/Actuarial) retained despite 1 paper; SA-07 (Quantum Walks) retained with 8 papers"
    rationale: "Distinct domains with specific modelling requirements"
    impact: "Low-evidence silos may need special handling in Phase 3"
    source: "p1_framework_synthesis/audit-trail.md (Entry 2-3)"

  - date: "2026-04-11"
    domain: "Phase 1 — Design principle"
    decision: "LLM as analytical assistant, not analytical authority"
    rationale: "Ensure researcher retains epistemic authority; audit trail documents divergences"
    impact: "All LLM outputs require explicit researcher approval before acceptance"
    source: "docs/METHODOLOGY_DESIGN.md §3.1"

  - date: "2026-04-14"
    domain: "Phase 2 — Extraction pipeline"
    decision: "6-step LLM extraction with gpt-5-mini on 777 papers"
    rationale: "Automated extraction at scale; validated against manual spot-checks"
    impact: "All papers have topic_tags and methodology_tags populated"
    source: "docs/BACKLOG.md (P2 section)"

  - date: "2026-04-17"
    domain: "Phase 3 — Quantum advantage freeze (superseded)"
    decision: "Froze P3 quantitative corpus and triangulation layer for P4 consumption"
    rationale: "P4 needs stable inputs; this freeze captured 459 S2 files / 1,185 experiments. Superseded by the 2026-04-22 A1 v2 rerun, which produced the current active 501 S2 files / 1,046 experiments baseline."
    impact: "Historical checkpoint preserved as `s3_freeze_2026_04_17_historical` in corpus_lineage.json. Active baseline is the 2026-04-22 rerun."
    source: "p3_thematic_synthesis/s2_quantitative/output/audit/corpus_lineage.json"

  - date: "2026-04-17"
    domain: "Phase 4 — Research contribution"
    decision: "Oracle tax as primary research contribution"
    rationale: "First corpus-scale measurement of gap between published and oracle-inclusive resource estimates in quantum finance"
    impact: "P4 focuses on resource estimation (not algorithm innovation). Pre-registered methodology."
    source: "p4_experiments/canonical/PRE_REGISTRATION.md"

  - date: "2026-04-18"
    domain: "Infrastructure — Project nervous system"
    decision: "Multi-skill architecture with copilot-instructions.md + PROJECT_STATE.yaml + 5 skills (project-status, consistency-check, methodology-guard, academic-writer, professor-review)"
    rationale: "Project too large for any single AI interaction to hold full context"
    impact: "Every Copilot interaction gets proactive cross-phase awareness; skills provide deep analysis on demand"
    source: "Copilot CLI session 2026-04-18"

  - date: "2026-04-19"
    domain: "Phase 3 — Restructuring"
    decision: "7-step thematic process with LLM-assisted coding, 5-layer safeguards, 8 active silos"
    rationale: "Reconciled two divergent design sessions. Reviewed by 4 skills. PD-10 merged into PD-03. PD-08 excluded. Full Thomas and Harden preserved with LLM automation."
    impact: "P3 thematic pipeline designed and directory structure created. Methodology chapter update required before execution."
    source: "Copilot CLI session 2026-04-19 + vallahrich meeting transcript"

  - date: "2026-04-26"
    domain: "Phase 3 — Finance framing sub-pipeline"
    decision: "Added s6_silo_framing as a descriptive sibling pipeline to s4 thematic synthesis"
    rationale: >
      Silo chapters were answering "which solutions" and "tested how" but not
      "what is the financial problem" or "why is it hard classically". The
      thematic synthesis is the wrong instrument for these descriptive
      framing questions. s6 reads the same source as Phase 2 (raw PDF text)
      with verbatim-quote substring verification and feeds Section (0) of each
      silo chapter.
    impact: >
      Each silo chapter now opens with a researcher-adapted finance framing
      sourced from F2 briefs (629/657 papers, 8/8 silos). The thematic
      synthesis (s4) remains untouched and the inductive movement of Phase 3
      is preserved as a self-contained contribution. Methodology chapter
      §4.5 documents the sub-pipeline; chapter 6 intro discloses the
      finance-framing layer.
    source: "Copilot CLI session 2026-04-26"

  - date: "2026-04-19"
    domain: "Phase 3 — Silo merges"
    decision: "PD-10 insurance_actuarial merged into PD-03 risk_management; PD-08 cryptography excluded"
    rationale: "PD-10: 8 papers, 1 experiment. PD-08: QKD-dominated, out of gate-based scope."
    impact: "8 active silos. Archived folders preserved in p3_thematic_synthesis/archive/."
    source: "Meeting with vallahrich 2026-04-19"

  - date: "2026-04-26"
    domain: "Phase 4 — Submission architecture"
    decision: "P4 canonical architecture finalised with core/, experiments/, canonical/reports/, canonical/outputs/, and canonical/release/ boundaries"
    rationale: "Separate source code, evidence, generated reports, scientific outputs, and release artifacts while preserving compatibility wrappers for old commands."
    impact: "P4 is audit-clean for the canonical 71-label grid; generated report JSONs live under canonical/reports/ and Phase 11 bundles the new layout."
    source: "p4_experiments/docs/ARCHITECTURE.md + p4_experiments/canonical/reports/audit/audit_phase11.json"

# ===========================================================================
# CROSS-PHASE CONTRACTS
# ===========================================================================

contracts:
  p1_to_p2:
    provider: "phase_1"
    consumer: "phase_2"
    artifacts:
      - "shared/config/unified_taxonomy.json — PD-01..10, SA-01..11 codes"
      - "p1_framework_synthesis/s4_outputs/codebook.md — operationalised definitions"
    invariant: "Taxonomy codes must not change without updating Phase 2 extraction prompts in p2_systematic_review/s2_classification/prompts/"

  p1_to_p3:
    provider: "phase_1"
    consumer: "phase_3"
    artifacts:
      - "PD codes define silo folder names via unified_taxonomy.json topic_tags[*].silo_folder"
    invariant: "PD code → silo_folder mapping must stay consistent. Adding/removing PD codes requires updating p3 problems/ folder structure."

  p2_to_p3:
    provider: "phase_2"
    consumer: "phase_3"
    artifacts:
      - "p2_systematic_review/output/processed/*.md — frontmatter with topic_tags, methodology_tags"
      - "shared/bridge/paper_id_bridge.csv — paper_id ↔ DOI ↔ Zotero mapping"
    invariant: "Paper frontmatter topic_tags must use Phase 1 taxonomy codes. paper_id_bridge.csv is the canonical ID mapping."

  p3_to_p4:
    provider: "phase_3"
    consumer: "phase_4"
    status: "FROZEN active baseline as of 2026-05-02"
    artifacts:
      - "p3_thematic_synthesis/s2_quantitative/output/extractions/*.json — 501 files, 1046 experiments"
      - "p3_thematic_synthesis/s3_quantum_advantage/combined/output/triangulation_matrix.filtered.json — 936 active rows"
