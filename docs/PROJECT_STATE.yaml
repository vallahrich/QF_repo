contracts:
  p1_to_p2:
    provider: "phase_1"
    consumer: "phase_2"
    artifact: "shared/config/unified_taxonomy.json and p1_framework_synthesis/s4_outputs/codebook.md"
    invariant: "P2 frontmatter topic/method tags must use the frozen taxonomy codes."
  p2_to_p3:
    provider: "phase_2"
    consumer: "phase_3"
    artifact: "p2_systematic_review/output/processed/ and shared/bridge/paper_id_bridge.csv"
    invariant: "P3 uses the processed corpus plus documented post-classification exclusions; active downstream subset is 755."
  p3_to_p4:
    provider: "phase_3"
    consumer: "phase_4"
    artifact: "Filtered active-silo S3 outputs and S2 quantitative extraction lineage"
    invariant: "Frozen active baseline as of 2026-05-02; any substantive P3 rerun requires P4 cohort/audit regeneration."

