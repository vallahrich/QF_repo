project:
  name: "Quantum Computing in Financial Services"
  type: "MSc Thesis"
  institution: "Copenhagen Business School (CBS)"
  programme: "MSc"
  repository_context: "Detached clean submission workspace"
  git_metadata_available_in_this_copy: false
  methodology_summary: >
    Four-part thesis pipeline: Phase 1 scoping/framework synthesis, Phase 2
    systematic literature review and classification, Phase 3 thematic and
    quantum-advantage synthesis, and Phase 4 resource-estimation experiment
    validation. LLM/API outputs are treated as assisted extraction or coding
    artifacts; researcher decisions, freeze records, audit logs, and checked
    derived outputs define the submitted evidence boundary.

authority:
  controlling_repository_freeze: "FREEZE.md"
  phase_freezes:
    - "p1_framework_synthesis/FREEZE.md"
    - "p2_systematic_review/FREEZE.md"
    - "p3_thematic_synthesis/FREEZE.md"
    - "p4_experiments/FREEZE.md"
    - "shared/FREEZE.md"
  reviewer_navigation:
    - "README.md"
    - "docs/ARCHITECTURE.md"
    - "docs/PIPELINE.md"
    - "docs/AUDIT_INDEX.md"
    - "docs/PROJECT_TIMELINE.md"
  historical_not_controlling:
    - "docs/METHODOLOGY_DESIGN.md"
    - "p2_systematic_review/s1_slr/01_protocol/protocol.md"
    - "p3_thematic_synthesis/docs/STALE_DOCS_AUDIT.md"

source_archive:
  root: "C:\\QF_submission_packages\\source_internal_archive\\QF_repo_supporting_artifacts_20260509"
  manifest: "C:\\QF_submission_packages\\source_internal_archive\\QF_repo_supporting_artifacts_20260509\\SOURCE_ARCHIVE_MANIFEST.csv"
  policy: >
    High-volume raw/support evidence, source PDFs, raw LLM I/O, local caches,
    and non-final snapshots were moved to the local source archive during the
    submission cleanup. The hand-in tree keeps current/canonical thesis evidence
    and referenced provenance artifacts.

