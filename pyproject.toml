[project]
name = "quantum-finance-thesis"
version = "2026.05.02"
description = "MSc thesis supplementary archive: Quantum Computing in Financial Services (Copenhagen Business School, 2026). Frozen submission artifact; verification surface only."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Aleix Moreño Telesforo" },
    { name = "Vincent Wallerich" },
]
keywords = ["quantum-computing", "finance", "systematic-review", "thematic-synthesis", "resource-estimation", "thesis"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[tool.pytest.ini_options]
# Repo-root pytest config: discover all phase test packages with one command.
# Added 2026-05-02 as part of the pre-freeze hygiene pass.
testpaths = [
    "shared/tests",
    "p2_systematic_review/tests",
    "p3_thematic_synthesis/tests",
]
# Ignore the inlined SLR toolkit's own pytest config (it has its own testpaths).
norecursedirs = [
    ".git",
    ".venv",
    "_archive",
    "node_modules",
    "manuscript",
    "p2_systematic_review/s1_slr",
    "p4_experiments/canonical/release",
]
filterwarnings = [
    # tiktoken can warn on first import in some environments; harmless.
    "ignore::DeprecationWarning:tiktoken",
]
