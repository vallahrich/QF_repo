[tool.pytest.ini_options]
# Repo-root pytest config: discover all phase test packages with one command.
# Added 2026-05-02 as part of the pre-freeze hygiene pass.
testpaths = [
    "shared/tests",
    "p2_systematic_review/tests",
    "p3_thematic_synthesis/tests",
]
# Ignore the inlined SLR toolkit's own pytest config (it has its own testpaths).
norecursedirs = [
    ".git",
    ".venv",
    "_archive",
    "node_modules",
    "manuscript",
    "p2_systematic_review/s1_slr",
    "p4_experiments/canonical/release",
]
filterwarnings = [
    # tiktoken can warn on first import in some environments; harmless.
    "ignore::DeprecationWarning:tiktoken",
]
